name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    name: Unit tests (no TensorFlow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy "opencv-python-headless>=4.9,<5" flask pillow pytest

      - name: Run fast tests
        run: pytest -m "not slow" --maxfail=1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install ruff
      - run: ruff check emotion_recognition webapp tests evaluate.py train.py realtimedetection.py --select E,F,W,I,UP,B --ignore E501
